# ==========================
# Humania ? application config
# Place this file in src/ or the project root
# Add to .gitignore
# ==========================

# ---------- App ----------
app.name=Humania

# ---------- Database ----------
db.url=jdbc:mysql://localhost:3306/humania_full
db.username=root
db.password=YOUR_DB_PASSWORD

# ---------- Resend (transactional email) ----------
resend.api.key=YOUR_RESEND_API_KEY

# ---------- Gmail SMTP ----------
# Use your Gmail address and an App Password (not your normal password)
# Generate one via Google Account > Security > App Passwords
gmail.username=YOUR_GMAIL_ADDRESS
gmail.app.password=YOUR_16_CHAR_APP_PASSWORD

# ---------- Google OAuth ----------
# 1. Go to https://console.cloud.google.com
# 2. Create/select a project
# 3. Enable OAuth 2.0
# 4. Add http://localhost as an authorized redirect URI
# 5. Copy the Client ID and Client Secret below
google.client.id=YOUR_GOOGLE_CLIENT_ID
google.client.secret=YOUR_GOOGLE_CLIENT_SECRET